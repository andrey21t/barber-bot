[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barber-bot"
version = "0.1.0"
description = "Telegram bot for booking a barber — MVP skeleton"
requires-python = ">=3.12"
# Верхние границы капов (2026-09-25): инцидент — rebuild прод-образа вытянул
# SQLAlchemy 2.1.1 по floor ">=2.0" (greenlet больше не ставится автоматически)
# → ImportError → crash-loop бота. Политика: <next-major для стабильных линий;
# жёстче — где риск доказан (SQLAlchemy <2.1 — сам инцидент) или очевиден
# сцепкой с aiogram-мажором (aiogram-calendar <0.7). Деплой ре-резолвит
# зависимости при каждом билде (pip install -e .[prod]), кап обязателен.
dependencies = [
    "aiogram>=3.4,<4",  # 4.x — breaking major
    "pydantic-settings>=2.1,<3",
    "aiosqlite>=0.19,<1",
    "SQLAlchemy>=2.0,<2.1",  # <2.1: 2.1.1 dropped auto-greenlet → ImportError crash (2026-09-25 prod)
    "APScheduler>=3.10,<4",  # 4.x — full rewrite
    "aiogram-calendar>=0.6,<0.7",  # 0.x-minor может прыгнуть на aiogram 4
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
    "freezegun>=1.5,<2",
]
# Prod-only deps (installed via `pip install -e .[prod]` on Render).
# asyncpg: async Postgres driver for ORM (SQLAlchemy async engine).
# psycopg2-binary: sync Postgres driver for SQLAlchemyJobStore (APScheduler) +
#   alembic migrations (alembic is sync).
# alembic: DB migrations (`alembic upgrade head` in preDeployCommand).
prod = [
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiogram_calendar.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false
